name: Check line endings

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: eol-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check committed line endings
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'eol-fixes/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR contents for normalization
        uses: actions/checkout@v7
        with:
          # PR files are used only for Git's attribute-based normalization.
          # Never run scripts, actions, builds, or tests from this checkout.
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Renormalize and check committed line endings
        id: check
        continue-on-error: true
        run: |
          git -C pr -c core.safecrlf=false add --renormalize .
          git -C pr diff --cached --exit-code --stat

      - name: Update fork PR line-ending guidance
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository &&
          (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          EOL_CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.info('PR was updated or closed, skipping the comment for this revision.');
              return;
            }

            const marker = '<!-- eol-fork-guidance -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            );
            const failed = process.env.EOL_CHECK_OUTCOME === 'failure';
            if (!failed && !existing) return;

            const body = failed ? [
              marker,
              'Fix line endings by running these from your repository root on the PR branch (with no uncommitted changes):',
              '',
              '```sh',
              'git -c core.safecrlf=false add --renormalize .',
              'git commit -m "Normalize line endings"',
              'git push',
              '```'
            ].join('\n') : [
              marker,
              'Line endings fixed.'
            ].join('\n');

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }

      - name: Verify the PR still points to this revision
        id: revision
        if: >-
          steps.check.outcome == 'failure' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current_head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,state --jq 'select(.state == "OPEN") | .headRefOid')
          if [[ "$current_head" == "$EXPECTED_HEAD" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR was updated or closed, skipping fixes for this revision."
          fi

      - name: Create or update stacked fix PR
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          FIX_BRANCH: eol-fixes/pr-${{ github.event.pull_request.number }}
        run: |
          # Commit the staged normalization directly; switching to the original
          # unnormalized tree makes Git report local changes and reject a cherry-pick.
          git -C pr -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Normalize line endings'

          remote_head=$(git -C pr -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            ls-remote origin "refs/heads/$FIX_BRANCH" | cut -f1)
          git -C pr -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/$FIX_BRANCH:$remote_head" \
            origin "HEAD:refs/heads/$FIX_BRANCH"

          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$FIX_BRANCH" --base "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -z "$existing_pr" ]]; then
            body_file="$RUNNER_TEMP/eol-fix-pr-body.md"
            printf 'Automatic line-ending fixes for #%s.\n\nMerge this PR to apply the fixes.\n' \
              "$PR_NUMBER" > "$body_file"
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$PR_BRANCH" \
              --head "$FIX_BRANCH" --title "Normalize line endings for #$PR_NUMBER" \
              --body-file "$body_file"
          fi

      - name: Require normalized line endings in the original PR
        if: ${{ !cancelled() && steps.check.outcome == 'failure' }}
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$SAME_REPOSITORY" == "true" ]]; then
            echo "::error::Line-ending check failed. Merge the stacked fix PR, if created, into the original PR branch."
          else
            echo "::error::Line-ending check failed. Normalize the files in your fork and push the fixes."
          fi
          exit 1

