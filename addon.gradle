def mod_version = project.findProperty('mod_version') ?: '1.0.27'
def mod_build_number = project.findProperty('mod_build_number') ?: ''

def version_name = mod_version
if (!mod_build_number.isEmpty()) {
    version_name = "${mod_version}_X${mod_build_number}_NTNH"
    version = "[${version_name}]"
} else {
    version = mod_version
}

ext.modVersion = version_name

// Keep dependency coordinates stable regardless of the checkout directory name.
afterEvaluate {
    publishing.publications.named('maven', MavenPublication) {
        artifactId = System.getenv('ARTIFACT_ID') ?: 'HBM-NTM'
    }
}

def capturedVersion = project.version
tasks.register('version') {
    doFirst {
        println capturedVersion
    }
}

gtnhToolchainModule.mcmodInfoProperties.put('credits', project.findProperty('credits') ?: '')

tasks.named('processResources').configure {
    doLast {
        def mcmodInfo = new File(outputs.files.singleFile, 'mcmod.info')
        mcmodInfo.text = mcmodInfo.getText('UTF-8')
            .replace("[${version_name}]", version_name)
    }
}

def forceCompressedJar = project.hasProperty('compressedJar')
def forceUncompressedJar = project.hasProperty('uncompressedJar')

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.hasTask(tasks.named('reobfJar').get())
    def compressedJar = (forceCompressedJar || buildsRelease) && !forceUncompressedJar
    tasks.named('jar', Jar).get().entryCompression = compressedJar
        ? org.gradle.api.tasks.bundling.ZipEntryCompression.DEFLATED
        : org.gradle.api.tasks.bundling.ZipEntryCompression.STORED
}

tasks.withType(JavaCompile).configureEach {
    options.forkOptions.memoryMaximumSize = '3g'
}

afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        if (javaCompiler.get().metadata.languageVersion.asInt() != 8) {
            sourceCompatibility = '8'
            targetCompatibility = '8'
            options.release.set(8)
            options.fork = false
        }
    }
}
